name: Publish Flutter web image

on:
  push:
    branches: [main]
    paths:
      - flutter_app/**
      - .github/workflows/publish-web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Build Flutter web
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter build web --release --no-wasm-dry-run

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./flutter_app
          file: ./flutter_app/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            oleksiikomarychev/workoutapp-web:latest
            oleksiikomarychev/workoutapp-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=flutter-web
          cache-to: type=gha,mode=max,scope=flutter-web
