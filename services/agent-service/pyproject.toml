[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-service"
version = "0.1.0"
description = "WorkoutApp agent service with chat capabilities"
requires-python = ">=3.12,<4.0"
dependencies = [
  "fastapi==0.112.0",
  "uvicorn[standard]==0.30.0",
  "httpx==0.28.1",
  "pydantic==2.10.0",
  "sqlalchemy==2.0.29",
  "langchain==0.3.0",
  "langchain-community==0.3.0",
  "langchain-openai",
  "psycopg2-binary==2.9.9",
  "alembic==1.15.0",
  "pydantic-ai==0.0.15",
  "langchain-google-genai",
  "google-genai==1.42.0",
  "json5==0.9.25",
  "huggingface_hub==0.25.0",
  "pillow==10.0.0",
  "google-auth>=2.36.0,<3.0.0",
  "structlog>=24.0.0,<25.0.0",
  "asgi-correlation-id==4.3.1",
  "prometheus-fastapi-instrumentator==6.1.0",
  "prometheus-client==0.16.0",
  "sentry-sdk[fastapi]==2.0.0",
  "celery[redis]==5.4.0",
  "redis==5.0.0",
  "backend-common",
  "uvloop==0.21.0",
]

[tool.uv.sources]
backend-common = { workspace = true }

[tool.setuptools]
packages = ["agent_service"]
package-dir = { "" = "." }
