[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "user-max-service"
version = "0.1.0"
description = "User Max CRUD Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.112.0",
    "uvicorn==0.30.0",
    "pydantic==2.10.0",
    "SQLAlchemy==2.0.29",
    "alembic==1.15.0",
    "httpx==0.28.1",
    "psycopg2-binary>=2.9",
    "google-genai>=1.0.0",
    "prometheus-fastapi-instrumentator>=6.1.0,<7.0.0",
    "prometheus-client>=0.16.0,<1.0.0",
    "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
    "backend-common",
    "uvloop>=0.19.0",
]

[tool.uv.sources]
backend-common = { workspace = true }

[project.optional-dependencies]
test = [
    "pytest==8.2.0",
]

[tool.setuptools]
packages = ["user_max_service"]
package-dir = { "" = "." }
