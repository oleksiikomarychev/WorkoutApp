[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workouts-service"
version = "0.1.0"
description = "Workouts CRUD Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.112.0",
    "uvicorn==0.30.0",
    "pydantic==2.10.0",
    "pydantic-settings>=2.2",
    "SQLAlchemy==2.0.29",
    "aiosqlite>=0.20.0,<0.21.0",
    "alembic==1.15.0",
    "httpx==0.28.1",
    "asyncpg",
    "psycopg2-binary>=2.9",
    "tenacity",
    "pytz>=2024.1",  # Added for timezone conversion
    "structlog>=24.0.0,<25.0.0",
    "asgi-correlation-id>=4.3.1,<5.0.0",
    "prometheus-fastapi-instrumentator>=6.1.0,<7.0.0",
    "prometheus-client>=0.16.0,<1.0.0",
    "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
    "redis>=5",
    "celery[redis]>=5.4.0,<6.0.0",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "grpcio-health-checking>=1.80.0",
    "protobuf>=4.25.0",
    "backend-common",
]

[tool.uv.sources]
backend-common = { workspace = true }

[project.optional-dependencies]
test = [
  "pytest==8.2.0",
]

[tool.setuptools]
packages = ["workouts_service"]
package-dir = { "" = "." }
