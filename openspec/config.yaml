schema: spec-driven

context: |
  Пояснения и обсуждения ведём на русском; обязательные заголовки OpenSpec,
  SHALL/MUST и идентификаторы сохраняем в формате стандартной схемы.
  Процесс: AGENTS.md и docs/development/README.md.
  Завершение change и hooks: docs/development/change-completion.md.
  Память проекта: docs/edge-cases/ и docs/decisions/.
  Новые области спецификаций предлагаем владельцу проекта для выбора.
  Выбор области не означает согласования всех требований; не превращать
  наблюдаемое поведение кода или предложения агента в принятые требования.
  Карта возможностей и общие контракты: docs/architecture/README.md.
  Для change используй docs/architecture/change-impact.md. Шесть семейств
  shared-contracts-draft.md приняты как целевые контракты; очередь rollout предложена.
  Общий EXEC принят: docs/decisions/DEC-20261112-operation-execution-contract.md.
  Общий ACCESS принят: docs/decisions/DEC-20261112-access-contract.md.
  Общий DATA принят: docs/decisions/DEC-20261112-data-semantics-contract.md.
  Общий EVENT принят: docs/decisions/DEC-20261112-event-delivery-contract.md.
  Общий READY принят: docs/decisions/DEC-20261112-capability-readiness-contract.md.
  Общий COMPAT принят: docs/decisions/DEC-20261112-contract-compatibility.md.
  Каждый change указывает применимость правил шести семейств и проверки затронутой области;
  принятие контракта не подтверждает соответствие существующих сервисов.

rules:
  proposal:
    - Укажи проблему, границы, non-goals и затронутые capability и сервисы.
    - Отдели согласованный объём от предложений и открытых продуктовых вопросов.
    - Найди связанные решения и edge cases; приведи ссылки или отметь отсутствие.
    - Укажи область влияния по карте возможностей, прямых потребителей и применимые семейства контрактов; учитывай явно принятые решения, остальные draft-правила остаются предложениями.
  specs:
    - Формулируй наблюдаемое поведение с Requirement и Scenario по стандартной схеме.
    - Опиши основной сценарий и релевантные границы или ошибки затронутого поведения.
    - Не оформляй нерешённые продуктовые вопросы как SHALL; вынеси их в proposal.
  design:
    - Для затронутого COMPAT укажи потребителей; при несовместимом изменении определи сочетания версий, порядок выпуска, миграцию и восстановление. Бессрочная поддержка всех версий и обратимость любой миграции не предполагаются.
    - Для затронутого READY определи зависимости функции, критерии готовности и режимы работы. Обязательность по окружениям и реакция запуска/API задаются отдельно; работающий процесс не доказывает готовности операции.
    - Для затронутого EVENT определи идентичность/повторы, значимый порядок, этапы подтверждения, восстановление/неуспешный исход и отставание проекций. Общий контракт не задаёт число повторов, сроки или единую exactly-once доставку.
    - Для затронутого DATA определи смысл/единицы, допустимость, точность, отсутствие/default, источник и роль данных; укажи влияние правки исходника на зависимые данные. Числовые границы и пересчёт истории не выводи из общего контракта.
    - Для затронутого ACCESS различай инициатора и владельца данных, действие и основание разрешения; путь через worker/cache/AI не расширяет права. Конкретные права тренера и отзыв доступа не выводи из общего контракта.
    - Для затронутых границ рассмотри совместимость потребителей, данные и частичные сбои.
    - Отдели выбранную политику атомарности, повторов и отказов от конкретного механизма её реализации.
    - Ссылайся на решения в docs/decisions; не объявляй предложенный вариант принятым.
  tasks:
    - Для каждого изменённого требования свяжи точное имя Requirement, Scenario, проверку, фактический результат и ограничения в существующем tasks/verification. Невыполненная обязательная гарантия блокирует завершение; используй docs/development/change-completion.md.
    - Для применимого COMPAT проверь вызывающий сценарий потребителя, ошибки и существующие данные; сверяй исходные контракты, производные файлы и реализацию. При постепенном выпуске проверь нужные сочетания версий.
    - Для применимого READY проверь реальный сценарий при доступной, отказавшей и восстановленной зависимости, сохранение независимых функций и применимые ошибки конфигурации/схемы/обработчика очереди.
    - Для применимого EVENT проверь цепочку событие → эффект → подтверждение с повтором и перезапуском между этапами; для проекций проверь создание/изменение/удаление, совместимость и распознавание отставания в выбранном reader.
    - Для применимого DATA проверь сохранение смысла при передаче/преобразовании/записи, согласованность затронутых путей ввода с учётом операции и пересчёт или сохранение зависимых данных по принятому правилу.
    - Для применимого ACCESS проверь подмену пользователя/объекта/пути вызова, отказ подтверждения прав и разрешённый сценарий на затронутых границах.
    - Для применимого EXEC проверь отказ зависимости, соответствие результата сохранённым эффектам и выбранную политику сбоя нескольких эффектов, включая отображение итога затронутым клиентом или AI.
    - Включи проверку критериев приёмки и воспроизведение связанных edge cases.
    - Укажи обновление specs и памяти проекта там, где поведение или решение изменилось.
    - Для применимых свойств укажи проверку границы или последовательности сбоев, а не только основной сценарий; не требуй полного аудита для каждой правки.

operations:
  apply:
    guidance:
      - Перед изменениями прочитай связанные specs, решения и edge cases.
      - Не реализуй нерешённые продуктовые варианты как будто они уже согласованы.
      - Записывай фактические команды проверок, результаты и ограничения.
  archive:
    guidance:
      - Сверь таблицу доказательств с каждым изменённым требованием и обязательными сценариями; failed/blocked/not-run не допускают завершения без согласованного изменения scope.
      - Проверь задачи и критерии; открытые пробелы не помечай выполненными.
      - Синхронизируй delta specs и обнови связанные edge cases и решения до архивирования.
