services:
  rpe-service:
    build:
      context: .
      dockerfile: services/rpe-service/Dockerfile
    image: docker.io/oleksiikomarychev/workoutapp-rpe-service:latest
    container_name: rpe-service
    env_file:
      - .env
    environment:
      - RPE_TABLE_PATH=/app/rpe_table.json
      - APP_ENV=${APP_ENV}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
      - "50051:50051"
    restart: unless-stopped
    networks:
      - workout-net

  plans-celery-worker:
    build:
      context: .
      dockerfile: services/plans-service/Dockerfile
    image: docker.io/oleksiikomarychev/workoutapp-plans-celery-worker:latest
    command: >-
      sh -c "celery -A plans_service.celery_app worker
      -Q plans.tasks
      --loglevel=${CELERY_LOG_LEVEL:-info}"
    env_file:
      - .env
    environment:
      - PLANS_DATABASE_URL=${PLANS_DATABASE_URL}
      - WORKOUTS_SERVICE_URL=http://workouts-service:8004
      - EXERCISES_SERVICE_URL=http://exercises-service:8002
      - APP_ENV=${APP_ENV}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CELERY_PLANS_QUEUE=plans.tasks
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      plans-service:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - workout-net

  agent-celery-worker:
    build:
      context: .
      dockerfile: services/agent-service/Dockerfile
    image: docker.io/oleksiikomarychev/workoutapp-agent-celery-worker:latest
    command: >-
      sh -c "celery -A agent_service.celery_app worker
      -Q agent.llm,agent.tools
      --loglevel=${CELERY_LOG_LEVEL:-info}"
    env_file:
      - .env
    environment:
      - AGENT_DATABASE_URL=${AGENT_DATABASE_URL}
      - RPE_TABLE_URL=http://rpe-service:8001/rpe/table
      - EXERCISES_SERVICE_URL=http://exercises-service:8002
      - PLANS_SERVICE_URL=http://plans-service:8005
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - APP_ENV=${APP_ENV}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CELERY_PLAN_QUEUE=agent.llm
      - CELERY_TOOLS_QUEUE=agent.tools
    depends_on:
      redis:
        condition: service_healthy
      agent-service:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - workout-net

  crm-service:
    build:
      context: .
      dockerfile: services/crm-service/Dockerfile
    image: docker.io/oleksiikomarychev/workoutapp-crm-service:latest
    container_name: crm-service
    env_file:
      - .env
    environment:
      - CRM_DATABASE_URL=${CRM_DATABASE_URL}
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET}
      - WORKOUTS_SERVICE_URL=http://workouts-service:8004
      - PLANS_SERVICE_URL=http://plans-service:8005
      - EXERCISES_SERVICE_URL=http://exercises-service:8002
      - APP_ENV=${APP_ENV}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8008:8008"
    restart: unless-stopped
    networks:
      - workout-net

  plans-service:
    build:
      context: .
      dockerfile: services/plans-service/Dockerfile
    image: docker.io/oleksiikomarychev/workoutapp-plans-service:latest
    container_name: plans-service
    env_file:
      - .env
    environment:
      - DATABASE_URL=${PLANS_DATABASE_URL}
      - PLANS_DATABASE_URL=${PLANS_DATABASE_URL}
      - ENABLE_EXERCISES_ROUTER=true
      - WORKOUTS_SERVICE_URL=http://workouts-service:8004
      - EXERCISES_SERVICE_URL=http://exercises-service:8002
      - CORS_ORIGINS=*
      - APP_ENV=${APP_ENV}
      - PLANS_REDIS_HOST=redis
      - PLANS_REDIS_PORT=6379
      - PLANS_REDIS_DB=0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CELERY_PLANS_QUEUE=plans.tasks
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - plans_data:/app/data
      - ./services/plans-service/alembic:/app/alembic
    ports:
      - "8005:8005"
      - "50053:50053"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - workout-net

  exercises-service:
    build:
      context: .
      dockerfile: services/exercises-service/Dockerfile
    image: docker.io/oleksiikomarychev/workoutapp-exercises-service:latest
    container_name: exercises-service
    env_file:
      - .env
    environment:
      - DATABASE_URL=${EXERCISES_DATABASE_URL}
      - PYTHONPATH=/app
      - APP_ENV=${APP_ENV}
      - EXERCISES_REDIS_HOST=redis
      - EXERCISES_REDIS_PORT=6379
      - EXERCISES_REDIS_DB=0
      - EXERCISES_MEDIA_DIR=/app/data/exercise_media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - exercises_data:/app/data
      - ./services/exercises-service/alembic:/app/alembic
    ports:
      - "8002:8002"
      - "50052:50052"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - workout-net

  social-service:
    build: ./social-service
    container_name: social-service
    ports:
      - "8011:8001"
    environment:
      - DATABASE_URL=postgresql://${SOCIAL_PG_USER:-user}:${SOCIAL_PG_PASSWORD:-pass}@postgres-social:5432/social
      - REDIS_URL=redis://redis:6379
      - WEBHOOK_HMAC_SECRET=${WEBHOOK_HMAC_SECRET}
      - APP_ENV=${APP_ENV}
    depends_on:
      postgres-social:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - workout-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  messaging-service:
    build: ./messaging-service
    container_name: messaging-service
    ports:
      - "8012:8002"
    environment:
      - DATABASE_URL=postgresql://${MESSAGING_PG_USER:-user}:${MESSAGING_PG_PASSWORD:-pass}@postgres-messaging:5432/messaging
      - REDIS_URL=redis://redis:6379
      - WEBHOOK_HMAC_SECRET=${WEBHOOK_HMAC_SECRET}
      - WS_HEARTBEAT_TIMEOUT=${WS_HEARTBEAT_TIMEOUT:-60}
      - WS_MAX_MESSAGE_SIZE=${WS_MAX_MESSAGE_SIZE:-65536}
      - TYPING_TTL=${TYPING_TTL:-5}
      - PRESENCE_TTL=${PRESENCE_TTL:-90}
      - APP_ENV=${APP_ENV}
    depends_on:
      postgres-messaging:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - workout-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  webhook-dispatcher:
    build: ./webhook-dispatcher
    container_name: webhook-dispatcher
    environment:
      - REDIS_URL=redis://redis:6379
      - SOCIAL_DATABASE_URL=postgresql://${SOCIAL_PG_USER:-user}:${SOCIAL_PG_PASSWORD:-pass}@postgres-social:5432/social
      - MESSAGING_DATABASE_URL=postgresql://${MESSAGING_PG_USER:-user}:${MESSAGING_PG_PASSWORD:-pass}@postgres-messaging:5432/messaging
      - WEBHOOK_TIMEOUT=${WEBHOOK_TIMEOUT:-10}
      - WEBHOOK_MAX_RETRIES=${WEBHOOK_MAX_RETRIES:-5}
      - APP_ENV=${APP_ENV}
    networks:
      - workout-net
    depends_on:
      redis:
        condition: service_healthy
      social-service:
        condition: service_healthy
      messaging-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: docker.io/oleksiikomarychev/workoutapp-gateway:latest
    container_name: api-gateway
    env_file:
      - .env
    environment:
      RPE_SERVICE_URL: "http://rpe-service:8001"
      EXERCISES_SERVICE_URL: "http://exercises-service:8002"
      USER_MAX_SERVICE_URL: "http://user-max-service:8003"
      WORKOUTS_SERVICE_URL: "http://workouts-service:8004"
      PLANS_SERVICE_URL: "http://plans-service:8005"
      AGENT_SERVICE_URL: "http://agent-service:8006"
      ACCOUNTS_SERVICE_URL: "http://accounts-service:8007"
      SOCIAL_SERVICE_URL: "http://social-service:8001"
      MESSAGING_SERVICE_URL: "http://messaging-service:8002"
      SOCIAL_API_URL: "http://social-service:8001"
      MESSAGING_API_URL: "http://messaging-service:8002"
      MESSENGER_APP_ID: "workout-tracker"
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET}
      CRM_SERVICE_URL: "http://crm-service:8008"
      MONO_WORKOUTS: "true"
      FIREBASE_CREDENTIALS_BASE64: "${FIREBASE_CREDENTIALS_BASE64}"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID}"
      FIREBASE_AUTH_EMULATOR_HOST: "host.docker.internal:9099"
      APP_ENV: ${APP_ENV}
      REDIS_URL: "redis://redis:6379"
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - workout-net

  user-max-service:
    build:
      context: .
      dockerfile: services/user-max-service/Dockerfile
    image: docker.io/oleksiikomarychev/workoutapp-user-max-service:latest
    container_name: user-max-service
    env_file:
      - .env
    environment:
      - DATABASE_URL=${USER_MAX_DATABASE_URL}
      - EXERCISES_SERVICE_URL=http://exercises-service:8002
      - APP_ENV=${APP_ENV}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - user_max_data:/app/data
      - ./services/user-max-service/alembic:/app/alembic
    ports:
      - "8003:8003"
    restart: unless-stopped
    networks:
      - workout-net

  workouts-service:
    build:
      context: .
      dockerfile: services/workouts-service/Dockerfile
    image: docker.io/oleksiikomarychev/workoutapp-workouts-service:latest
    container_name: workouts-service
    env_file:
      - .env
    environment:
      - WORKOUTS_DATABASE_URL=${WORKOUTS_DATABASE_URL}
      - PLANS_SERVICE_URL=http://plans-service:8005
      - EXERCISES_SERVICE_URL=http://exercises-service:8002
      - RPE_SERVICE_URL=http://rpe-service:8001
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET}
      - USER_MAX_SERVICE_URL=http://user-max-service:8003
      - APP_ENV=${APP_ENV}
      - WORKOUTS_REDIS_HOST=redis
      - WORKOUTS_REDIS_PORT=6379
      - WORKOUTS_REDIS_DB=0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - workouts_data:/app/data
      - ./services/workouts-service/alembic/versions:/app/alembic/versions
    ports:
      - "8004:8004"
      - "50054:50054"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - workout-net

  workouts-celery-worker:
    build:
      context: .
      dockerfile: services/workouts-service/Dockerfile
    image: docker.io/oleksiikomarychev/workoutapp-workouts-celery-worker:latest
    command: >-
      sh -c "celery -A workouts_service.celery_app worker
      -Q workouts.tasks
      --loglevel=${CELERY_LOG_LEVEL:-info}"
    env_file:
      - .env
    environment:
      - WORKOUTS_DATABASE_URL=${WORKOUTS_DATABASE_URL}
      - PLANS_SERVICE_URL=http://plans-service:8005
      - EXERCISES_SERVICE_URL=http://exercises-service:8002
      - RPE_SERVICE_URL=http://rpe-service:8001
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET}
      - USER_MAX_SERVICE_URL=http://user-max-service:8003
      - APP_ENV=${APP_ENV}
      - WORKOUTS_REDIS_HOST=redis
      - WORKOUTS_REDIS_PORT=6379
      - WORKOUTS_REDIS_DB=0
      - CELERY_BROKER_URL=redis://redis:6379/3
      - CELERY_RESULT_BACKEND=redis://redis:6379/4
      - CELERY_WORKOUTS_QUEUE=workouts.tasks
    volumes:
      - workouts_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      workouts-service:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - workout-net

  agent-service:
    build:
      context: .
      dockerfile: services/agent-service/Dockerfile
    image: docker.io/oleksiikomarychev/workoutapp-agent-service:latest
    env_file:
      - .env
    environment:
      - LLM_SPLIT_GENERATION=1
      - AGENT_DATABASE_URL=${AGENT_DATABASE_URL}
      - RPE_TABLE_URL=http://rpe-service:8001/rpe/table
      - EXERCISES_SERVICE_URL=http://exercises-service:8002
      - PLANS_SERVICE_URL=http://plans-service:8005
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - APP_ENV=${APP_ENV}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CELERY_PLAN_QUEUE=agent.llm
      - CELERY_TOOLS_QUEUE=agent.tools
    ports:
      - "8006:8006"
    depends_on:
      - user-max-service
      - exercises-service
      - plans-service
    restart: unless-stopped
    networks:
      - workout-net

  accounts-service:
    build:
      context: .
      dockerfile: ./services/accounts-service/Dockerfile
    image: docker.io/oleksiikomarychev/workoutapp-accounts-service:latest
    container_name: accounts-service
    env_file:
      - .env
    environment:
      - DATABASE_URL=${ACCOUNTS_DATABASE_URL}
      - PLANS_SERVICE_URL=http://plans-service:8005
      - APP_ENV=${APP_ENV}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8007:8007"
      - "50055:50055"
    restart: unless-stopped
    networks:
      - workout-net

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - workout-net

  postgres-social:
    image: postgres:15
    container_name: postgres-social
    volumes:
      - postgres_social_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=social
      - POSTGRES_USER=${SOCIAL_PG_USER:-user}
      - POSTGRES_PASSWORD=${SOCIAL_PG_PASSWORD:-pass}
    ports:
      - "5433:5432"
    networks:
      - workout-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d social"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-messaging:
    image: postgres:15
    container_name: postgres-messaging
    volumes:
      - postgres_messaging_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=messaging
      - POSTGRES_USER=${MESSAGING_PG_USER:-user}
      - POSTGRES_PASSWORD=${MESSAGING_PG_PASSWORD:-pass}
    ports:
      - "5434:5432"
    networks:
      - workout-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d messaging"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles:
      - monitoring
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - workout-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles:
      - monitoring
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - workout-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    ports:
      - "2181:2181"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workout-net
    profiles:
      - analytics

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
      - "29092:29092"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - workout-net
    profiles:
      - analytics

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workout-net
    profiles:
      - analytics

  debezium-connect:
    image: debezium/connect:2.4
    container_name: debezium-connect
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium-connect-group
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - workout-net
    profiles:
      - analytics

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clickhouse-client", "-q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workout-net
    profiles:
      - analytics

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://debezium-connect:8083
    ports:
      - "8084:8080"
    restart: unless-stopped
    networks:
      - workout-net
    profiles:
      - analytics

volumes:
  exercises_data:
  user_max_data:
  workouts_data:
  plans_data:
  grafana_data:
  redis_data:
  postgres_social_data:
  postgres_messaging_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  clickhouse_data:
  clickhouse_logs:

