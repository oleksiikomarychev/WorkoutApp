services:
  rpe-service:
    image: docker.io/oleksiikomarychev/workoutapp-rpe-service:latest
    environment:
      - RPE_TABLE_PATH=/app/rpe_table.json
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET:?}
      - APP_ENV=production
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0}
    restart: always
    networks:
      - workout-net

  plans-celery-worker:
    image: docker.io/oleksiikomarychev/workoutapp-plans-service:latest
    profiles:
      - workers
    command: >-
      sh -c "celery -A plans_service.celery_app worker
      -Q plans.tasks
      --loglevel=${CELERY_LOG_LEVEL:-info}"
    environment:
      - PLANS_DATABASE_URL=${PLANS_DATABASE_URL:?}
      - WORKOUTS_SERVICE_URL=http://workouts-service:8004
      - EXERCISES_SERVICE_URL=http://exercises-service:8002
      - APP_ENV=production
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?}@redis:6379/2
      - CELERY_PLANS_QUEUE=plans.tasks
    depends_on:
      redis:
        condition: service_healthy
      plans-service:
        condition: service_started
    restart: always
    networks:
      - workout-net

  agent-celery-worker:
    image: docker.io/oleksiikomarychev/workoutapp-agent-service:latest
    profiles:
      - agent
    command: >-
      sh -c "celery -A agent_service.celery_app worker
      -Q agent.llm,agent.tools
      --loglevel=${CELERY_LOG_LEVEL:-info}"
    environment:
      - AGENT_DATABASE_URL=${AGENT_DATABASE_URL:-}
      - RPE_TABLE_URL=http://rpe-service:8001/rpe/table
      - EXERCISES_SERVICE_URL=http://exercises-service:8002
      - PLANS_SERVICE_URL=http://plans-service:8005
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - STAGED_LLM_PROVIDER=${STAGED_LLM_PROVIDER:-}
      - GENAI_STAGED_MODEL=${GENAI_STAGED_MODEL:-}
      - FIREWORKS_API_KEY=${FIREWORKS_API_KEY:-}
      - FIREWORKS_BASE_URL=${FIREWORKS_BASE_URL:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - APP_ENV=production
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?}@redis:6379/2
      - CELERY_PLAN_QUEUE=agent.llm
      - CELERY_TOOLS_QUEUE=agent.tools
    depends_on:
      redis:
        condition: service_healthy
      agent-service:
        condition: service_started
    restart: always
    networks:
      - workout-net

  crm-service:
    image: docker.io/oleksiikomarychev/workoutapp-crm-service:latest
    profiles:
      - crm
    environment:
      - CRM_DATABASE_URL=${CRM_DATABASE_URL:-}
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET:?}
      - WORKOUTS_SERVICE_URL=http://workouts-service:8004
      - PLANS_SERVICE_URL=http://plans-service:8005
      - EXERCISES_SERVICE_URL=http://exercises-service:8002
      - APP_ENV=production
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PLATFORM_FEE_PERCENT=${STRIPE_PLATFORM_FEE_PERCENT:-5.0}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - STRIPE_CHECKOUT_SUCCESS_URL=${STRIPE_CHECKOUT_SUCCESS_URL:-}
      - STRIPE_CHECKOUT_CANCEL_URL=${STRIPE_CHECKOUT_CANCEL_URL:-}
    restart: always
    networks:
      - workout-net

  plans-service:
    image: docker.io/oleksiikomarychev/workoutapp-plans-service:latest
    environment:
      - DATABASE_URL=${PLANS_DATABASE_URL:?}
      - PLANS_DATABASE_URL=${PLANS_DATABASE_URL:?}
      - ENABLE_EXERCISES_ROUTER=true
      - WORKOUTS_SERVICE_URL=http://workouts-service:8004
      - EXERCISES_SERVICE_URL=http://exercises-service:8002
      - CORS_ORIGINS=*
      - APP_ENV=production
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0}
      - PLANS_REDIS_HOST=redis
      - PLANS_REDIS_PORT=6379
      - PLANS_REDIS_DB=0
      - PLANS_REDIS_PASSWORD=${REDIS_PASSWORD:?}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?}@redis:6379/2
      - CELERY_PLANS_QUEUE=plans.tasks
    volumes:
      - plans_data:/app/data
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - workout-net

  exercises-service:
    image: docker.io/oleksiikomarychev/workoutapp-exercises-service:latest
    environment:
      - DATABASE_URL=${EXERCISES_DATABASE_URL:?}
      - EXERCISES_DATABASE_URL=${EXERCISES_DATABASE_URL:?}
      - PYTHONPATH=/app
      - APP_ENV=production
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0}
      - EXERCISES_REDIS_HOST=redis
      - EXERCISES_REDIS_PORT=6379
      - EXERCISES_REDIS_DB=0
      - EXERCISES_REDIS_PASSWORD=${REDIS_PASSWORD:?}
      - EXERCISES_MEDIA_DIR=/app/data/exercise_media
    volumes:
      - exercises_data:/app/data
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - workout-net

  gateway:
    image: docker.io/oleksiikomarychev/workoutapp-gateway:latest
    environment:
      RPE_SERVICE_URL: "http://rpe-service:8001"
      EXERCISES_SERVICE_URL: "http://exercises-service:8002"
      USER_MAX_SERVICE_URL: "http://user-max-service:8003"
      WORKOUTS_SERVICE_URL: "http://workouts-service:8004"
      PLANS_SERVICE_URL: "http://plans-service:8005"
      AGENT_SERVICE_URL: "http://agent-service:8006"
      ACCOUNTS_SERVICE_URL: "http://accounts-service:8007"
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET:?}
      CRM_SERVICE_URL: "http://crm-service:8008"
      MONO_WORKOUTS: "true"
      FIREBASE_CREDENTIALS_BASE64: ${FIREBASE_CREDENTIALS_BASE64:?}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?}
      GATEWAY_REDIS_HOST: redis
      GATEWAY_REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      APP_ENV: production
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    expose:
      - "8000"
    depends_on:
      exercises-service:
        condition: service_started
      user-max-service:
        condition: service_started
      rpe-service:
        condition: service_started
      plans-service:
        condition: service_started
      workouts-service:
        condition: service_started
      accounts-service:
        condition: service_started
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - workout-net

  user-max-service:
    image: docker.io/oleksiikomarychev/workoutapp-user-max-service:latest
    environment:
      - DATABASE_URL=${USER_MAX_DATABASE_URL:?}
      - USER_MAX_DATABASE_URL=${USER_MAX_DATABASE_URL:?}
      - EXERCISES_SERVICE_URL=http://exercises-service:8002
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET:?}
      - APP_ENV=production
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0}
    volumes:
      - user_max_data:/app/data
    restart: always
    networks:
      - workout-net

  workouts-service:
    image: docker.io/oleksiikomarychev/workoutapp-workouts-service:latest
    environment:
      - WORKOUTS_DATABASE_URL=${WORKOUTS_DATABASE_URL:?}
      - SUPPLEMENTS_DATABASE_URL=sqlite:////app/data/supplements.db
      - PLANS_SERVICE_URL=http://plans-service:8005
      - EXERCISES_SERVICE_URL=http://exercises-service:8002
      - RPE_SERVICE_URL=http://rpe-service:8001
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET:?}
      - USER_MAX_SERVICE_URL=http://user-max-service:8003
      - APP_ENV=production
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0}
      - WORKOUTS_REDIS_HOST=redis
      - WORKOUTS_REDIS_PORT=6379
      - WORKOUTS_REDIS_DB=0
      - WORKOUTS_REDIS_PASSWORD=${REDIS_PASSWORD:?}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?}@redis:6379/3
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?}@redis:6379/4
    volumes:
      - workouts_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    networks:
      - workout-net

  workouts-celery-worker:
    image: docker.io/oleksiikomarychev/workoutapp-workouts-service:latest
    profiles:
      - workers
    command: >-
      sh -c "celery -A workouts_service.celery_app worker
      -Q workouts.tasks
      --loglevel=${CELERY_LOG_LEVEL:-info}"
    environment:
      - WORKOUTS_DATABASE_URL=${WORKOUTS_DATABASE_URL:?}
      - SUPPLEMENTS_DATABASE_URL=sqlite:////app/data/supplements.db
      - PLANS_SERVICE_URL=http://plans-service:8005
      - EXERCISES_SERVICE_URL=http://exercises-service:8002
      - RPE_SERVICE_URL=http://rpe-service:8001
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET:?}
      - USER_MAX_SERVICE_URL=http://user-max-service:8003
      - APP_ENV=production
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0}
      - WORKOUTS_REDIS_HOST=redis
      - WORKOUTS_REDIS_PORT=6379
      - WORKOUTS_REDIS_DB=0
      - WORKOUTS_REDIS_PASSWORD=${REDIS_PASSWORD:?}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?}@redis:6379/3
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?}@redis:6379/4
      - CELERY_WORKOUTS_QUEUE=workouts.tasks
    volumes:
      - workouts_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      workouts-service:
        condition: service_started
    restart: always
    networks:
      - workout-net

  agent-service:
    image: docker.io/oleksiikomarychev/workoutapp-agent-service:latest
    profiles:
      - agent
    environment:
      - LLM_SPLIT_GENERATION=1
      - AGENT_DATABASE_URL=${AGENT_DATABASE_URL:-}
      - RPE_TABLE_URL=http://rpe-service:8001/rpe/table
      - EXERCISES_SERVICE_URL=http://exercises-service:8002
      - PLANS_SERVICE_URL=http://plans-service:8005
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - STAGED_LLM_PROVIDER=${STAGED_LLM_PROVIDER:-}
      - GENAI_STAGED_MODEL=${GENAI_STAGED_MODEL:-}
      - FIREWORKS_API_KEY=${FIREWORKS_API_KEY:-}
      - FIREWORKS_BASE_URL=${FIREWORKS_BASE_URL:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - APP_ENV=production
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?}@redis:6379/2
      - CELERY_PLAN_QUEUE=agent.llm
      - CELERY_TOOLS_QUEUE=agent.tools
    expose:
      - "8006"
    depends_on:
      - user-max-service
      - exercises-service
      - plans-service
    restart: always
    networks:
      - workout-net

  accounts-service:
    image: docker.io/oleksiikomarychev/workoutapp-accounts-service:latest
    environment:
      - ACCOUNTS_DATABASE_URL=${ACCOUNTS_DATABASE_URL:?}
      - PLANS_SERVICE_URL=http://plans-service:8005
      - INTERNAL_GATEWAY_SECRET=${INTERNAL_GATEWAY_SECRET:?}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_CONNECT_RETURN_URL=${STRIPE_CONNECT_RETURN_URL:-}
      - STRIPE_CONNECT_REFRESH_URL=${STRIPE_CONNECT_REFRESH_URL:-}
      - APP_ENV=production
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0}
    restart: always
    networks:
      - workout-net

  redis:
    image: redis:7-alpine
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - workout-net

  prometheus:
    image: prom/prometheus:latest
    profiles:
      - monitoring
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    restart: always
    networks:
      - workout-net

  grafana:
    image: grafana/grafana:latest
    profiles:
      - monitoring
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: always
    networks:
      - workout-net

  # === CDC / Analytics Stack ===
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    restart: always
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workout-net
    profiles:
      - analytics

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: always
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - workout-net
    profiles:
      - analytics

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workout-net
    profiles:
      - analytics

  debezium-connect:
    image: debezium/connect:2.4
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium-connect-group
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - workout-net
    profiles:
      - analytics

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    restart: always
    healthcheck:
      test: ["CMD", "clickhouse-client", "-q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workout-net
    profiles:
      - analytics

volumes:
  exercises_data:
  user_max_data:
  workouts_data:
  plans_data:
  grafana_data:
  redis_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  clickhouse_data:
  clickhouse_logs:

networks:
  workout-net:
    driver: bridge
